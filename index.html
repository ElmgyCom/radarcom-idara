:root{
  --ink:#17324a;--ink-2:#2a4a63;--paper:#f3f6f5;--card:#fff;--line:#d9e2df;--line-2:#e8eeec;--muted:#566874;
  --zel:#0d7466;--zel-2:#0a5d52;--zel-soft:#e3f2ef;--saffron:#9a6412;--saffron-soft:#fbf1df;
  --q1:#bf2438;--q1s:#fde8eb;--q2:#2152b8;--q2s:#e7eefc;--q3:#a85200;--q3s:#fdeedd;--q4:#5f6b74;--q4s:#eef1f3;
  --ok:#1b6f48;--oks:#e2f3ea;--warn:#8a5a00;--err:#a61b2b;--errs:#fdecee;
  --r-lg:18px;--r-md:12px;--r-sm:8px;--tap:46px;--shadow:0 1px 2px rgba(23,50,74,.06),0 4px 14px rgba(23,50,74,.06);
  --font:"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--font);-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--zel-2)}
.hidden{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .flip{transform:scaleX(-1)}
:focus-visible{outline:3px solid #6aa9ff;outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);cursor:pointer;font-weight:700;font-size:15px;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f7faf9}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--zel);border-color:var(--zel);color:#fff}
.btn.primary:hover{background:var(--zel-2)}
.btn.danger{color:var(--err);border-color:#efc4ca}
.btn.danger.solid{background:var(--err);color:#fff;border-color:var(--err)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px}
.btn.icon{width:var(--tap);padding:0}
.btn.pressed,.btn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
small,.small{font-size:13.5px}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .wrap{max-width:1320px;margin:auto;padding:8px 12px 0}
.brandrow{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:40px;height:40px;flex:none}
.brand h1{margin:0;font-size:19px;line-height:1.15;letter-spacing:.2px;direction:ltr;unicode-bidi:isolate}
.brand .credit{margin:0;font-size:13px;color:#c9dbe6;line-height:1.3}
.topbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.22)}
.topbar .btn:hover{background:rgba(255,255,255,.1)}
.savepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 8px;margin-top:3px;border-radius:99px;background:rgba(255,255,255,.1);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.lbl-short{display:none}
.savepill .dot{width:8px;height:8px;border-radius:50%;background:#9fb3c0;flex:none}
.savepill[data-s=saved] .dot{background:#5fd3a5}.savepill[data-s=saving] .dot{background:#ffd166}
.savepill[data-s=failed]{background:#7a1622}.savepill[data-s=failed] .dot{background:#ff8a96}
.savepill[data-s=synced] .dot{background:#7cc6ff}
.badge{min-width:20px;height:20px;border-radius:10px;background:#e24a5c;color:#fff;font-size:12px;display:inline-grid;place-items:center;padding:0 5px}
.badge:empty,.badge[data-n="0"]{display:none}
.wsbar{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.wsbar button{flex:1;min-width:max-content;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border-radius:12px 12px 0 0;border:0;background:rgba(255,255,255,.08);color:#d5e3ec;font-weight:700;font-size:14.5px;cursor:pointer;padding:6px 12px}
.wsbar button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
.navrow{background:var(--paper);border-bottom:1px solid var(--line)}
.navrow .wrap{padding:8px 12px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:thin}
.navrow .btn{min-width:max-content;border-color:transparent;background:transparent;color:var(--ink-2);font-size:14.5px}
.navrow .btn[aria-current=page]{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.navrow .btn.add{background:var(--zel);color:#fff;border-color:var(--zel);padding-inline:16px}
.navrow .sep{flex:1}
@media (max-width:640px){
  .brand h1{font-size:17px}.mark{width:34px;height:34px}
  .lbl-long{display:none}.lbl-short{display:inline}
  .topbar .wrap{padding:6px 8px 0}.brandrow .btn{min-height:42px}.brandrow .btn.icon{width:42px}

  .strip{grid-template-columns:repeat(4,1fr);gap:6px}.strip button{padding:6px 8px;min-height:54px}.strip b{font-size:19px}.strip span{font-size:11px;line-height:1.25;display:block}

/* menu */

.menu button:hover{background:var(--paper)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .danger-zone{color:var(--err)}
.menu .zone-label{font-size:12px;color:var(--muted);padding:4px 10px}

/* banners */
main{max-width:1320px;margin:auto;padding:12px}
.banner{border-radius:var(--r-md);padding:10px 14px;margin-bottom:10px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:#eef5fb;border-color:#cfe0ee}
.banner.warn{background:var(--saffron-soft);border-color:#ecd3a6}
.banner.err{background:var(--errs);border-color:#f0c3c9}
.banner{flex-wrap:wrap}.banner p{margin:0;flex:1 1 200px}
.state-screen{max-width:560px;margin:40px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 22px}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--zel);border-radius:50%;margin:0 auto 12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.strip button{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;text-align:start;cursor:pointer;min-height:64px}

/* layout */
.cal-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:12px;align-items:start}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.panel.pad{padding:14px}

.calbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}

.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.weekhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-block:1px solid var(--line);background:#f8fbfa}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{position:relative;min-height:96px;border:0;border-inline-end:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:var(--card);padding:5px;text-align:start;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden}
.day.out{background:#fafcfb;color:#9aa8b0}

.day.today .n{background:var(--zel);color:#fff;box-shadow:0 0 0 3px var(--zel-soft)}

.day .ev{font-size:11px;line-height:1.3;border-radius:5px;padding:1px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.day .chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}

.qchip.done{background:var(--oks);color:var(--ok)}
@media (max-width:640px){.day{min-height:62px;padding:3px}.day .ev{display:none}.day .ev.first{display:block;font-size:9.5px;padding:0 2px}.day .n{font-size:13.5px;width:24px;height:24px}.qchip{font-size:9px;padding:2px 3px}}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;font-size:12.5px}

.source{font-size:12.5px;color:var(--muted);padding:0 12px 12px}
.weekview{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.weekview .col{border-inline-end:1px solid var(--line-2);min-height:260px;padding:6px;cursor:pointer}
.weekview .col h4{margin:0 0 6px;font-size:13px}
.weekview .mini{font-size:12px;border-radius:6px;padding:3px 5px;margin-bottom:4px;border-inline-start:3px solid currentColor;background:#fafcfb;cursor:pointer;overflow-wrap:anywhere}
@media (max-width:700px){.weekview{grid-template-columns:1fr}.weekview .col{min-height:0;border-bottom:1px solid var(--line-2)}}

/* day panel / cards */
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.offevent{border-radius:var(--r-md);padding:8px 10px;margin-bottom:8px;font-size:14px;border:1px solid}

.tasklist{display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-inline-start:6px solid var(--q4);border-radius:var(--r-md);padding:10px 12px;background:var(--card)}

.pill.hol{background:var(--saffron-soft);color:#6c4508}

.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

}

/* ---- Dates. All-day dates are plain 'YYYY-MM-DD' strings: never converted through UTC, so no shifts.
   Clock times are Africa/Casablanca wall-clock 'YYYY-MM-DDTHH:MM'. ---- */
const TZ='Africa/Casablanca';
const pad=n=>String(n).padStart(2,'0');
const casaParts=(d=new Date())=>{
  const p={};new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(x=>p[x.type]=x.value);
  return p;
};
let __clockOffset=0; // test hook only
const nowMs=()=>Date.now()+__clockOffset;
function todayStr(){const p=casaParts(new Date(nowMs()));return `${p.year}-${p.month}-${p.day}`}
function nowCasa(){const p=casaParts(new Date(nowMs()));return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`}
function casaToEpoch(local){ // 'YYYY-MM-DDTHH:MM' Casablanca wall time -> epoch ms (handles DST/Ramadan shifts)
  const [d,tm='00:00']=local.split('T');const [y,m,dd]=d.split('-').map(Number);const [h,mi]=tm.split(':').map(Number);
  let guess=Date.UTC(y,m-1,dd,h,mi);
  for(let i=0;i<3;i++){const p=casaParts(new Date(guess));const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);guess+= Date.UTC(y,m-1,dd,h,mi)-asUTC}
  return guess;
}
function epochToCasa(ms){const p=casaParts(new Date(ms));return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`}
function addMinutesCasa(local,min){return epochToCasa(casaToEpoch(local)+min*60000)}
// pure calendar arithmetic on date strings (UTC noon anchor, timezone-independent)
const dObj=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d,12))};
const dStr=o=>`${o.getUTCFullYear()}-${pad(o.getUTCMonth()+1)}-${pad(o.getUTCDate())}`;
const addDays=(s,n)=>{const o=dObj(s);o.setUTCDate(o.getUTCDate()+n);return dStr(o)};
const addMonths=(s,n)=>{const o=dObj(s);const day=o.getUTCDate();o.setUTCDate(1);o.setUTCMonth(o.getUTCMonth()+n);const last=new Date(Date.UTC(o.getUTCFullYear(),o.getUTCMonth()+1,0,12)).getUTCDate();o.setUTCDate(Math.min(day,last));return dStr(o)};
const dow=s=>dObj(s).getUTCDay(); // 0=Sun
const weekStart=s=>addDays(s,-((dow(s)+6)%7)); // Monday
const monthStart=s=>s.slice(0,8)+'01';
const monthEnd=s=>{const o=dObj(monthStart(s));o.setUTCMonth(o.getUTCMonth()+1);o.setUTCDate(0);return dStr(o)};
const daysBetween=(a,b)=>Math.round((dObj(b)-dObj(a))/86400000);
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&dStr(dObj(s))===s;
function fmtDate(s,opt){if(!validDate(s))return s||'';return dObj(s).toLocaleDateString(locale(),Object.assign({timeZone:'UTC',day:'numeric',month:'long',year:'numeric'},opt||{}))}
function fmtShort(s){return fmtDate(s,{year:undefined,day:'numeric',month:'short'})}
function fmtDayLong(s){return fmtDate(s,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtMonth(s){return fmtDate(s,{day:undefined,month:'long',year:'numeric'})}
function fmtDT(local){if(!local)return '';const [d,tm]=local.split('T');return fmtShort(d)+' '+(tm||'')}

'use strict';
/* Storage design (fixes the "opens with 0 tasks" class of bugs):
   - Records are written one by one (put/delete). There is no "save the whole list" operation,
     so a failed or empty load can never overwrite valid stored data.
   - Load has three explicit outcomes: ok (possibly genuinely empty), failed (error screen, no writes), loading. */
const DB_NAME='RadarComIdara', DB_VER=1, STORES=['tasks','attachments','meta','snapshots'];
const APP_VERSION='2.0.0';
const SCHEMA=2;
let idb=null;
const S={tasks:new Map(),atts:new Map(),meta:{},loadState:'loading',loadError:'',readOnly:false,pendingFail:new Set(),lastSavedAt:0};

function idbOpen(timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)||!window.indexedDB) return reject(new Error('IndexedDB غير متاح / indisponible'));
    let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('timeout '+timeoutMs+'ms'))}},timeoutMs);
    let req;
    try{req=indexedDB.open(DB_NAME,DB_VER)}catch(e){clearTimeout(timer);return reject(e)}
    req.onupgradeneeded=()=>{const db=req.result;
      if(!db.objectStoreNames.contains('tasks')){const s=db.createObjectStore('tasks',{keyPath:'id'});s.createIndex('updatedAt','updatedAt')}
      if(!db.objectStoreNames.contains('attachments')){const s=db.createObjectStore('attachments',{keyPath:'id'});s.createIndex('taskId','taskId')}
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});
      if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots',{keyPath:'id'});
    };
    req.onblocked=()=>{/* another tab holds an older version; keep waiting until timeout */};
    req.onerror=()=>{if(done)return;done=true;clearTimeout(timer);reject(req.error||new Error('open error'))};
    req.onsuccess=()=>{const db=req.result;if(done){db.close();return}done=true;clearTimeout(timer);
      db.onversionchange=()=>{db.close();idb=null;toast(t('upd_ready'))};resolve(db)};
  });
}
function txDone(tx){return new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error||new Error('tx error'));tx.onabort=()=>rej(tx.error||new Error('tx aborted'))})}
async function idbAll(store){const tx=idb.transaction(store,'readonly');const r=tx.objectStore(store).getAll();await txDone(tx);return r.result||[]}
async function idbGet(store,key){const tx=idb.transaction(store,'readonly');const r=tx.objectStore(store).get(key);await txDone(tx);return r.result}
async function idbWrite(ops){ // ops: [{store, put?:value, del?:key}]
  if(!idb) throw new Error('DB closed');
  const stores=[...new Set(ops.map(o=>o.store))];
  const tx=idb.transaction(stores,'readwrite');
  for(const o of ops){const st=tx.objectStore(o.store);if('del' in o)st.delete(o.del);else st.put(o.put)}
  await txDone(tx);
}

/* ---- save status ---- */
let saveTimer=null;
function setSave(state,detail){
  const el=$('savePill');if(!el)return;
  el.dataset.s=state;
  const txt=state==='saving'?t('save_saving'):state==='failed'?t('save_failed'):state==='loading'?t('save_loading'):state==='readonly'?t('save_readonly'):state==='synced'?t('save_synced',{t:detail||''}):t('save_saved',{t:S.lastSavedAt?new Date(S.lastSavedAt).toLocaleTimeString(locale(),{timeZone:TZ,hour:'2-digit',minute:'2-digit'}):''});
  $('savePillText').textContent=txt;el.title=txt+(state==='failed'&&detail?' — '+detail:'');
}
function errText(e){
  if(!e)return '?';
  if(e.name==='QuotaExceededError'||/quota/i.test(e.message||''))return t('toast_quota');
  return (e.name&&e.name!=='Error'?e.name+': ':'')+(e.message||String(e));
}
let writeChain=Promise.resolve();
/* commit: memory is updated first (UI stays responsive), then written. On failure the change stays
   in memory, is flagged as unsaved, and the status says so — it is never silently dropped. */
function commit(ops,{quiet}={}){
  if(S.readOnly){setSave('readonly');toast(t('st_readonlyBanner'));return Promise.reject(new Error('read-only'))}
  for(const o of ops){
    if(o.store==='tasks'){if('del' in o)S.tasks.delete(o.del);else S.tasks.set(o.put.id,o.put)}
    if(o.store==='attachments'){if('del' in o)S.atts.delete(o.del);else{const {blob,...m}=o.put;S.atts.set(o.put.id,{...m,size:blob?blob.size:m.size})}}
    if(o.store==='meta'&&!('del' in o))S.meta[o.put.key]=o.put.value;
  }

function periodFor(kind,ref,from,to){

  if(kind==='term'){const tm=TERMS.find(x=>ref>=x.start&&ref<=x.end)||(ref<TERMS[1].start?TERMS[0]:TERMS[1]);return [tm.start,tm.end,tm]}

function computeReport(a,b,wsSet){
  const pool=active().filter(x=>wsSet.has(x.ws));
  const inR=d=>d&&d>=a&&d<=b;
  const due=pool.filter(x=>inR(x.date));
  const dueDone=due.filter(x=>x.status==='done');
  const cancelled=due.filter(x=>x.status==='cancelled');
  const remaining=due.filter(isOpen);
  const overdue=remaining.filter(isOverdue);
  const doneIn=pool.filter(x=>x.status==='done'&&inR(x.completedAt));
  const den=due.length-cancelled.length;
  const rate=den>0?Math.round(dueDone.length*1000/den)/10:null;
  const count=(arr,f)=>{const m=new Map();arr.forEach(x=>{const k=f(x);m.set(k,(m.get(k)||0)+1)});return m};
  const byStatus=count(due,x=>x.status);
  const byQ=count(due,x=>x.q);
  const byCat=count(due,x=>x.ws+'|'+x.category);
  const byWs=count(due,x=>x.ws);
  const days=daysBetween(a,b)+1;const weekly=days>31;
  const buckets=[];
  if(weekly){for(let s=weekStart(a);s<=b;s=addDays(s,7))buckets.push({key:s,from:s,to:addDays(s,6)})}
  else for(let s=a;s<=b;s=addDays(s,1))buckets.push({key:s,from:s,to:s});
  buckets.forEach(k=>k.n=doneIn.filter(x=>x.completedAt>=k.from&&x.completedAt<=k.to).length);
  const td=todayStr(),lim=addDays(td,14);
  const upcoming=pool.filter(x=>isOpen(x)&&x.date>=td&&x.date<=lim).sort((x,y)=>x.q-y.q||x.date.localeCompare(y.date)).slice(0,12);
  const rows=[...new Map(due.concat(doneIn).map(x=>[x.id,x])).values()].sort((x,y)=>x.date.localeCompare(y.date)||x.q-y.q);
  return {a,b,due,dueDone,cancelled,remaining,overdue,doneIn,den,rate,byStatus,byQ,byCat,byWs,buckets,weekly,upcoming,rows};
}

/* ---- merge (import + sync): per record, newest updatedAt wins; ids never duplicated ---- */
function planMerge(incoming){
  const plan={add:[],update:[],keep:[],tomb:[]};
  for(const r of incoming){
    const cur=S.tasks.get(r.id);
    if(!cur){(r.deleted?plan.tomb:plan.add).push(r);continue}
    if((r.updatedAt||0)>(cur.updatedAt||0)){(r.deleted&&!cur.deleted?plan.tomb:plan.update).push(r)}
    else plan.keep.push(r);
  }
  return plan;
}

/* ---------- migration from the previous app (never deletes, never overwrites newer edits) ---------- */
function readOldIdb(){return new Promise(async res=>{
  try{if(indexedDB.databases){const list=await indexedDB.databases();if(!list.some(d=>d.name==='RadarComPrivateData'))return res(null)}else return res(null)}catch(e){return res(null)}
  let r;try{r=indexedDB.open('RadarComPrivateData')}catch(e){return res(null)}
  const to=setTimeout(()=>res(null),5000);
  r.onerror=()=>{clearTimeout(to);res(null)};
  r.onsuccess=()=>{const db=r.result;try{const tx=db.transaction('snapshots','readonly');const g=tx.objectStore('snapshots').get('current');g.onsuccess=()=>{clearTimeout(to);db.close();res(g.result||null)};g.onerror=()=>{clearTimeout(to);db.close();res(null)}}catch(e){clearTimeout(to);db.close();res(null)}};
})}
async function runMigrations(){
  const done=S.meta.migrations||{};const sources=[];
  const add=(key,state,name)=>{if(state&&validLegacyState(state)&&!done[key])sources.push({key,state,name,savedAt:state.savedAt||0})};
  if(SEED)add('seed:'+(SEED.recovery||'')+':'+(SEED.savedAt||0),SEED,'RadarCom_idara.html');
  const ls=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
  for(const k of ['radarcom.local.v3','radarcom.local.v3.mirror']){const st=ls(k);if(st)add('ls:'+k+':'+st.savedAt,st,'localStorage '+k)}
  const v2=ls('radarcom.local.v2');if(Array.isArray(v2)&&v2.length)add('ls:v2:'+v2.length,{tasks:v2,savedAt:1},'localStorage v2');
  const old=await readOldIdb();if(old)add('oldidb:'+old.savedAt,old,'IndexedDB RadarComPrivateData');
  const oldProfile=ls('radarcom.profile.v1')||SEED?.profile||null;
  if(!sources.length)return;
  await makeSnapshot('migration-before',{raw:sources.map(s=>({name:s.name,state:s.state}))});
  sources.sort((a,b)=>a.savedAt-b.savedAt);
  const latest=new Map();
  for(const s of sources)for(const o of s.state.tasks){if(o&&o.id!=null)latest.set(String(o.id),{o,src:{name:s.name,savedAt:s.savedAt,recovery:s.state.recovery}})}
  const ops=[];let added=0,updated=0;
  for(const [id,{o,src}] of latest){
    const x=fromLegacy(o,src);const cur=S.tasks.get(id);
    if(!cur){legacyPhotos(o).forEach((p,i)=>{const aid='att-'+id.slice(0,40)+'-'+i;x.attIds.push(aid);ops.push({store:'attachments',put:{id:aid,taskId:id,name:p.name||'photo',type:'image/jpeg',createdAt:x.createdAt,blob:dataURLtoBlob(p.data)}})});ops.push({store:'tasks',put:x});added++}
    else if(cur.origin?.legacyId&&!cur.deleted&&(cur.updatedAt||0)<x.updatedAt){
      ops.push({store:'tasks',put:{...cur,title:x.title,notes:x.notes,date:x.date,time:x.time,q:x.q,status:x.status,completedAt:x.completedAt,reminder:x.reminder,category:x.category,updatedAt:x.updatedAt}});updated++}
  }
  const mig={...done};sources.forEach(s=>mig[s.key]=Date.now());
  ops.push({store:'meta',put:{key:'migrations',value:mig}});
  ops.push({store:'meta',put:{key:'lastMigration',value:{at:Date.now(),added,updated,sources:sources.map(s=>s.name+' ('+s.state.tasks.length+')')}}});
  if(oldProfile&&(oldProfile.updatedAt||0)>(S.meta.profile?.updatedAt||0)){
    ops.push({store:'meta',put:{key:'profile',value:{director:oldProfile.director||defaultProfile().director,school:oldProfile.school||defaultProfile().school,updatedAt:oldProfile.updatedAt||Date.now()}}});
    if(oldProfile.pinHash&&!S.meta.lock?.hash)ops.push({store:'meta',put:{key:'lock',value:{hash:oldProfile.pinHash,salt:oldProfile.pinSalt,autoMin:0}}});
  }
  await commit(ops,{quiet:true});
}

async function updateTask(id,patch,{silent}={}){
  const x=S.tasks.get(id);if(!x)return;const prev={...x};
  const n=normTask({...x,...patch,updatedAt:Date.now()});const ops=[{store:'tasks',put:n}];
  let next=null;if(isOpen(prev)&&!isOpen(n)){next=nextOccurrence(n);if(next)ops.push({store:'tasks',put:next})}
  try{await commit(ops)}catch(e){renderAll();return}
  renderAll();if(next&&!silent)toast(t('toast_nextOcc',{d:fmtShort(next.date)}));
  return {prev,next};
}
async function completeTask(id,date){

  toast(t('toast_done',{d:fmtShort(d)})+(r.next?' · '+t('toast_nextOcc',{d:fmtShort(r.next.date)}):''),{action:t('act_undo'),onAction:async()=>{const ops=[{store:'tasks',put:{...r.prev,updatedAt:Date.now()}}];if(r.next)ops.push({store:'tasks',put:{...r.next,deleted:true,deletedAt:Date.now(),updatedAt:Date.now()}});await commit(ops);renderAll()}});
}

  await updateTask(id,{date:d,startDate:x.startDate&&x.startDate>d?d:x.startDate,reminder:rem,status:x.status==='postponed'?'pending':x.status});toast(t('toast_resched',{d:fmtShort(d)}))}
async function duplicateTask(id){const x=S.tasks.get(id);const now=Date.now();const c=normTask({...x,id:uid(),title:x.title,status:'pending',completedAt:'',attIds:[],seriesId:'',subtasks:x.subtasks.map(s=>({...s,id:uid(),done:false})),reminder:{...x.reminder,ackAt:'',snoozeUntil:''},createdAt:now,updatedAt:now,origin:{source:'duplicate',from:x.id},translations:{}});

const kpi=(n,k)=>`<div class="kpi"><b>${n}</b><span>${t(k)}</span></div>`;

function donut(parts){
  const total=parts.reduce((s,p)=>s+p[1],0);if(!total)return `<p class="empty">${t('c_empty')}</p>`;
  const R=60,C=2*Math.PI*R;let off=0;

  return `<div class="row" style="align-items:center;gap:14px"><svg viewBox="0 0 160 160" style="width:150px;height:150px" role="img" aria-label="${esc(parts.map(p=>p[0]+' '+p[1]).join('، '))}">${segs}<text x="80" y="78" text-anchor="middle" font-size="28" font-weight="700" fill="#17324a">${total}</text><text x="80" y="100" text-anchor="middle" font-size="11" fill="#566874">${esc(t('nav_tasks'))}</text></svg>

function hbars(rows){

}
function trend(buckets,weekly){
  const total=buckets.reduce((s,b)=>s+b.n,0);if(!total)return `<p class="empty">${t('c_empty')}</p>`;
  const W=640,H=230,L=34,B=196,top=20,n=buckets.length,step=(W-L-10)/n,max=Math.max(1,...buckets.map(b=>b.n));let cum=0;
  const pts=buckets.map((b,i)=>{cum+=b.n;return [L+i*step+step/2,B-(cum/total)*(B-top)]});
  const every=Math.ceil(n/12);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('c_trend'))}: ${total}"><line x1="${L}" y1="${B}" x2="${W-6}" y2="${B}" stroke="#c9d6d2"/>${[0,.5,1].map(f=>`<text x="${L-6}" y="${B-f*(B-top)+4}" font-size="11" text-anchor="end" fill="#566874">${Math.round(f*max)}</text>`).join('')}
  ${buckets.map((b,i)=>{const h=b.n/max*(B-top);const x=L+i*step+1;return `<g><title>${esc(fmtShort(b.from))}${weekly?' – '+esc(fmtShort(b.to)):''}: ${b.n}</title><rect x="${x}" y="${B-h}" width="${Math.max(2,step-3)}" height="${h}" rx="2" fill="#0d7466"/>${b.n&&step>14?`<text x="${x+step/2-1}" y="${B-h-4}" font-size="10" text-anchor="middle">${b.n}</text>`:''}${i%every===0?`<text x="${x+step/2-1}" y="${B+16}" font-size="10" text-anchor="middle" fill="#566874">${weekly?esc(b.from.slice(5).replace('-','/')):+b.from.slice(8)}</text>`:''}</g>`}).join('')}
  <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#9a6412" stroke-width="2.5"/><text x="${W-8}" y="${top-6}" font-size="11" text-anchor="end" fill="#9a6412">Σ ${total}</text></svg>`;
}

/* ---------- backup / restore ---------- */
async function buildBackup(withPhotos=true){
  const tasks=[...S.tasks.values()];const attachments=[];
  if(withPhotos)for(const a of S.atts.values()){try{const b=await getAttBlob(a.id);if(b)attachments.push({id:a.id,taskId:a.taskId,name:a.name,type:b.type,createdAt:a.createdAt,data:await blobToB64(b)})}catch(e){}}
  return {format:'radarcom-idara-backup',schema:SCHEMA,app:APP_VERSION,exportedAt:Date.now(),profile:S.meta.profile,settings:S.meta.settings,events:S.meta.events||[],tasks,attachments};
}
async function exportBackup(share){
  const data=await buildBackup(true);const name=`RadarCom-idara-backup-${todayStr()}-${nowCasa().slice(11).replace(':','')}.json`;
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  let shared=false;
  if(share){try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'RadarCom-idara backup'});shared=true}else toast(t('bk_shareUnsupported'))}catch(e){if(e.name==='AbortError')return}}
  if(!shared)download(name,blob);
  if(!S.readOnly)await putMeta('backup',{...(S.meta.backup||{}),lastExportAt:Date.now()},{quiet:true}).catch(()=>{});
  toast(t('bk_exported',{n:data.tasks.filter(x=>!x.deleted).length,a:data.attachments.length}));renderBanners();
}
let pendingImport=null;
function openRestore(){$('rsFile').value='';$('rsPreview').innerHTML='';$('rsErr').textContent='';$('rsApply').disabled=true;pendingImport=null;openDlg('dlgRestore')}
function wireRestore(){
  $('rsFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('rsErr').textContent='';$('rsApply').disabled=true;
    try{const P=await parseBackupFile(f);const plan=planMerge(P.tasks);const newAtts=P.atts.filter(a=>!S.atts.has(a.id));pendingImport={P,plan,newAtts};
      $('rsPreview').innerHTML=`<div class="card" style="margin-top:8px"><h3>${t('bk_preview')}</h3><p class="small">${esc(t('bk_file',{n:f.name,d:P.exportedAt?fmtStamp(P.exportedAt):'—'}))}</p><ul class="diff"><li>${t('bk_new',{n:plan.add.length})}</li><li>${t('bk_newer',{n:plan.update.length})}</li><li>${t('bk_tomb',{n:plan.tomb.filter(x=>S.tasks.has(x.id)).length})}</li><li class="muted">${t('bk_older',{n:plan.keep.length})}</li><li>${t('bk_att',{n:newAtts.length})}</li></ul>
      ${P.profile?`<label class="chk"><input type="checkbox" id="rsProfile"><span>${t('bk_profile')}</span></label>`:''}<p class="small muted">${t('bk_snapNote')}</p></div>`;$('rsApply').disabled=false}
    catch(err){$('rsErr').textContent=t('bk_invalid',{e:err.message||err})}};
  $('rsApply').onclick=async()=>{if(!pendingImport)return;$('rsApply').disabled=true;const {P,plan,newAtts}=pendingImport;
    try{await makeSnapshot('before-import',{file:P.name});
      const ops=[];for(const x of plan.add.concat(plan.update,plan.tomb))ops.push({store:'tasks',put:x});
      for(const a of newAtts){try{ops.push({store:'attachments',put:{id:a.id,taskId:a.taskId,name:a.name,type:a.type,createdAt:a.createdAt||Date.now(),blob:dataURLtoBlob('data:'+(a.type||'image/jpeg')+';base64,'+a.data)}})}catch(e){}}
      if($('rsProfile')?.checked&&P.profile)ops.push({store:'meta',put:{key:'profile',value:{director:P.profile.director,school:P.profile.school,updatedAt:Date.now()}}});
      if(P.events&&P.events.length){const ids=new Set((S.meta.events||[]).map(e=>e.id));ops.push({store:'meta',put:{key:'events',value:(S.meta.events||[]).concat(P.events.filter(e=>!ids.has(e.id)))}})}
      for(let i=0;i<ops.length;i+=200)await commit(ops.slice(i,i+200));
      closeDlg('dlgRestore');renderAll();toast(t('bk_done',{a:plan.add.length,u:plan.update.length}))}
    catch(e){$('rsErr').textContent=t('toast_saveFail',{e:errText(e)});$('rsApply').disabled=false}};
}
async function restoreSnapshot(id){
  const s=await idbGet('snapshots',id);if(!s)return;
  const snapTasks=s.tasks.map(normTask);let changed=0,revived=0;const ops=[];const now=Date.now();
  for(const x of snapTasks){if(x.deleted)continue;const cur=S.tasks.get(x.id);
    if(!cur||cur.deleted){revived++;ops.push({store:'tasks',put:{...x,deleted:false,deletedAt:0,purged:false,updatedAt:now}})}
    else if(JSON.stringify({...cur,updatedAt:0})!==JSON.stringify({...x,updatedAt:0})){changed++;ops.push({store:'tasks',put:{...x,updatedAt:now}})}}
  if(!await ask(`${fmtStamp(s.createdAt)} — ${s.reason}\n\n• ${revived} ↩\n• ${changed} ✎\n\n${LANG==='fr'?'Les tâches créées depuis sont conservées.':'المهام التي أُنشئت بعد هذه اللقطة تبقى كما هي.'}`))return;
  await makeSnapshot('before-snapshot-restore');await commit(ops);renderAll();toast(t('bk_done',{a:revived,u:changed}));
}
async function linkFile(){
  try{const h=await window.showSaveFilePicker({suggestedName:'RadarCom-idara-auto-backup.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
    await putMeta('fileHandle',h,{quiet:true});await writeLinkedFile(true);renderSettings()}catch(e){if(e.name!=='AbortError')toast(errText(e))}
}
let fileTimer;
async function writeLinkedFile(now){
  const h=S.meta.fileHandle;if(!h)return;
  const run=async()=>{try{if(h.queryPermission&&(await h.queryPermission({mode:'readwrite'}))!=='granted')return;const w=await h.createWritable();await w.write(JSON.stringify(await buildBackup(true)));await w.close();
    S.meta.backup={...(S.meta.backup||{}),lastFileAt:Date.now(),lastExportAt:Date.now()};await idbWrite([{store:'meta',put:{key:'backup',value:S.meta.backup}}])}catch(e){}};
  clearTimeout(fileTimer);if(now)return run();fileTimer=setTimeout(run,4000);
}
function afterWrite(){writeLinkedFile();if(typeof syncSoon==='function')syncSoon()}

    toast(t('da_done',{n:list.length}),{action:t('act_undo'),onAction:async()=>{const n2=Date.now();await commit(ids.map(id=>({store:'tasks',put:{...S.tasks.get(id),deleted:false,deletedAt:0,updatedAt:n2}})));renderAll()}})};
  openDlg('dlgDelAll');
}

/* ---------- PIN (interface lock, not encryption) ---------- */
async function pinHash(pin,salt){if(!crypto.subtle)throw new Error('crypto.subtle');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},k,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let lkFails=0,lkUntil=0,lastAct=Date.now();
function lockNow(){U.locked=true;$('lockscreen').classList.remove('hidden');$('lkPin').value='';$('lkErr').textContent='';$('lkSchool').value='';document.querySelectorAll('dialog[open]').forEach(d=>d.close());window.speechSynthesis?.cancel();setTimeout(()=>$('lkPin').focus(),50)}
function wireLock(){
  $('lkForm').onsubmit=async e=>{e.preventDefault();if(Date.now()<lkUntil){$('lkErr').textContent=t('lk_wait',{n:Math.ceil((lkUntil-Date.now())/1000)});return}
    try{const l=S.meta.lock;if(await pinHash($('lkPin').value,l.salt)===l.hash){U.locked=false;lkFails=0;$('lockscreen').classList.add('hidden');lastAct=Date.now();renderAll();checkReminders()}
      else{lkFails++;if(lkFails>=5){lkUntil=Date.now()+30000;lkFails=0}$('lkErr').textContent=t('lk_bad');$('lkPin').value=''}}catch(err){$('lkErr').textContent=err.message}};
  $('lkReset').onclick=()=>{if($('lkSchool').value.trim()!==(S.meta.profile?.school||'').trim()){$('lkResetMsg').textContent=t('lk_bad');return}
    let n=60;$('lkReset').disabled=true;const iv=setInterval(async()=>{n--;$('lkResetMsg').textContent=n+'…';if(n<=0){clearInterval(iv);await putMeta('lock',{});U.locked=false;$('lockscreen').classList.add('hidden');$('lkReset').disabled=false;renderAll()}},1000)};
  ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
  setInterval(()=>{const m=S.meta.lock?.autoMin;if(m&&S.meta.lock.hash&&!U.locked&&Date.now()-lastAct>m*60000)lockNow()},20000);
}
async function setPin(){
  const msg=m=>$('sPinMsg').textContent=m;const l=S.meta.lock||{};
  try{if(l.hash&&await pinHash($('sPinOld').value,l.salt)!==l.hash)return msg(t('set_pinBad'));
    const p=$('sPinNew').value;if(!/^\d{6,12}$/.test(p))return msg(t('set_pinFormat'));if(p!==$('sPinC').value)return msg(t('set_pinMismatch'));
    const salt=uid();await putMeta('lock',{hash:await pinHash(p,salt),salt,autoMin:Math.max(0,+$('sPinAuto').value||0)});renderSettings();toast(t('set_pinOn'))}catch(e){msg(e.message)}
}
async function removePin(){const l=S.meta.lock;if(await pinHash($('sPinOld').value,l.salt)!==l.hash){$('sPinMsg').textContent=t('set_pinBad');return}await putMeta('lock',{});renderSettings();toast(t('set_pinOff'))}

window.__bip=null;window.__swWaiting=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e});
async function installApp(){
  if(window.__bip){window.__bip.prompt();try{await window.__bip.userChoice}catch(e){}window.__bip=null;return}
  go('settings');toast(/^(file|content):/.test(location.protocol)?t('set_installFile'):t('set_installHelp'),{sticky:true});
}
async function registerSW(){
  if(!('serviceWorker' in navigator)||!/^https:$/.test(location.protocol)&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))return;
  try{const reg=await navigator.serviceWorker.register('sw.js');
    const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){window.__swWaiting=w;renderBanners()}})};
    if(reg.waiting&&navigator.serviceWorker.controller){window.__swWaiting=reg.waiting;renderBanners()}
    reg.addEventListener('updatefound',()=>watch(reg.installing));
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(window.__reloading)return;window.__reloading=true;location.reload()});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='notif')handleNotifAction(e.data.action,e.data.id)});
    registerPeriodic();setInterval(()=>reg.update().catch(()=>{}),6*3600e3);
  }catch(e){}
}
async function registerPeriodic(){try{const reg=await navigator.serviceWorker?.ready;if(reg?.periodicSync&&permState()==='granted'){const st=await navigator.permissions.query({name:'periodic-background-sync'});if(st.state==='granted')await reg.periodicSync.register('rc-reminders',{minInterval:60*60*1000})}}catch(e){}}
async function applyUpdate(){await writeChain;if(window.__swWaiting)window.__swWaiting.postMessage('skipWaiting')}
function handleUrlAction(){const p=new URLSearchParams(location.search);const a=p.get('nact'),id=p.get('id');if(a&&id){history.replaceState(null,'',location.pathname);handleNotifAction(a,id)}}
async function handleNotifAction(a,id){const x=S.tasks.get(id);if(!x)return;
  if(a==='done'){await completeTask(id)}else if(a==='snooze'){await snooze(id,'10')}else{U.ws=x.ws;U.sel=x.date;U.anchor=x.date;go('calendar');await updateTask(id,{reminder:{...x.reminder,ackAt:reminderEff(x)}});openEditor(S.tasks.get(id))}}

'use strict';
/* Optional private sync through the user's own Firebase project (free Spark plan: Firestore 1 GiB, 50k reads / 20k writes per day).
   Nothing is loaded or sent until the user enables it. Data path: users/{uid}/... protected by firestore.rules (owner only).
   Merge: per task, newest updatedAt wins; deletions are synced as tombstones; when both sides changed since the
   last sync the losing version is kept in a local "conflicts" list for review. Pull uses a server timestamp cursor
   (syncedAt) so device clock skew cannot hide changes. Photos go to users/{uid}/attachments as base64 (<= ~900 KB each). */
const FB_VER='11.10.0';
let FB=null,syncing=false,syncTimer=null,syncMsg='';
const syncCfg=()=>S.meta.sync||{};
const httpsOK=()=>location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
async function fbLoad(cfg){
  if(FB)return FB;
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  const [a,au,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=a.initializeApp(cfg,'radarcom-sync');FB={app,auth:au.getAuth(app),db:fs.getFirestore(app),au,fs};return FB;
}
async function syncEnable(){
  if(!httpsOK()){syncMsg=t('set_syncHttps');return renderSettings()}
  let cfg;try{cfg=JSON.parse($('syCfg').value)}catch(e){syncMsg='JSON ✗';return renderSettings()}
  const email=$('syEmail').value.trim();
  try{await fbLoad(cfg);const p=new FB.au.GoogleAuthProvider();if(email)p.setCustomParameters({login_hint:email,prompt:'select_account'});
    const r=await FB.au.signInWithPopup(FB.auth,p);
    if(email&&r.user.email!==email){await FB.au.signOut(FB.auth);syncMsg='✗ '+r.user.email;return renderSettings()}
    await putMeta('sync',{...syncCfg(),enabled:true,config:cfg,email,uid:r.user.uid,userEmail:r.user.email});await syncNow()}
  catch(e){syncMsg='✗ '+(e.code||e.message)}renderSettings();
}
async function syncDisable(){try{if(FB)await FB.au.signOut(FB.auth)}catch(e){}await putMeta('sync',{...syncCfg(),enabled:false});syncMsg='';renderSettings()}
function syncSoon(){if(!syncCfg().enabled)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,5000)}
async function syncAutoStart(){
  const c=syncCfg();if(!c.enabled||!httpsOK())return;
  try{await fbLoad(c.config);FB.au.onAuthStateChanged(FB.auth,u=>{if(u&&u.uid===c.uid)syncNow();else syncMsg=LANG==='fr'?'reconnexion requise':'يلزم تسجيل الدخول من جديد'})}catch(e){syncMsg='✗ '+e.message}
  window.addEventListener('online',syncSoon);setInterval(()=>{if(document.visibilityState==='visible')syncNow()},120000);
}
async function syncNow(){
  const c=syncCfg();if(!c.enabled||syncing||!FB||!FB.auth.currentUser||!navigator.onLine)return;
  syncing=true;const {fs,db}=FB;const uid=FB.auth.currentUser.uid;const col=n=>fs.collection(db,'users',uid,n);
  try{
    // 1) pull remote changes since the server cursor
    const since=fs.Timestamp.fromMillis(c.cursor||0);
    const snap=await fs.getDocs(fs.query(col('tasks'),fs.where('syncedAt','>',since)));
    let cursor=c.cursor||0;const ops=[];const conflicts=(S.meta.conflicts||[]).slice(-40);const needAtt=new Set();
    snap.forEach(d=>{const raw=d.data();cursor=Math.max(cursor,raw.syncedAt?.toMillis?.()||0);delete raw.syncedAt;const r=normTask(raw);const cur=S.tasks.get(r.id);
      if(!cur||r.updatedAt>cur.updatedAt){
        if(cur&&cur.updatedAt>(c.lastPushAt||0)&&JSON.stringify({...cur,updatedAt:0})!==JSON.stringify({...r,updatedAt:0}))conflicts.push({at:Date.now(),kept:'remote',lost:cur});
        ops.push({store:'tasks',put:r});r.attIds.forEach(a=>{if(!S.atts.has(a))needAtt.add(a)})}
      else if(cur.updatedAt>r.updatedAt&&r.updatedAt>(c.lastPushAt||0))conflicts.push({at:Date.now(),kept:'local',lost:r});
    });
    for(const a of needAtt){try{const ad=await fs.getDoc(fs.doc(db,'users',uid,'attachments',a));if(ad.exists()){const v=ad.data();ops.push({store:'attachments',put:{id:a,taskId:v.taskId,name:v.name,type:v.type,createdAt:v.createdAt||Date.now(),blob:dataURLtoBlob('data:'+v.type+';base64,'+v.data)}})}}catch(e){}}
    if(ops.length)await commit(ops,{quiet:true});
    // 2) push local changes; a transaction refuses to replace a newer remote record
    const pushStart=Date.now();const dirty=[...S.tasks.values()].filter(x=>x.updatedAt>(c.lastPushAt||0));
    for(const x of dirty){const ref=fs.doc(db,'users',uid,'tasks',x.id);
      await fs.runTransaction(db,async tx=>{const r=await tx.get(ref);if(r.exists()&&(r.data().updatedAt||0)>x.updatedAt)return;tx.set(ref,{...x,syncedAt:fs.serverTimestamp()})})}
    const up=new Set(c.uploaded||[]);let skipped=0;
    for(const a of S.atts.values()){if(up.has(a.id))continue;const b=await getAttBlob(a.id);if(!b)continue;const data=await blobToB64(b);
      if(data.length>950000){skipped++;continue}await fs.setDoc(fs.doc(db,'users',uid,'attachments',a.id),{taskId:a.taskId,name:a.name,type:b.type,createdAt:a.createdAt||Date.now(),data});up.add(a.id)}
    await commit([{store:'meta',put:{key:'sync',value:{...syncCfg(),cursor,lastPushAt:pushStart,lastSyncAt:Date.now(),uploaded:[...up]}}},{store:'meta',put:{key:'conflicts',value:conflicts}}],{quiet:true});
    syncMsg=(LANG==='fr'?'OK':'تمت')+(skipped?` · ${skipped} 📷 > 900KB`:'');setSave('synced',fmtStamp(Date.now()));if(ops.length)renderAll();
  }catch(e){syncMsg='✗ '+(e.code||e.message);setSave('saved')}finally{syncing=false}
}
function renderSyncCard(el){
  const c=syncCfg();
  el.innerHTML=`<h3>${ic('cloud')} ${t('set_sync')}</h3>${c.enabled?`<p class="small"><b>${esc(c.userEmail||'')}</b> · ${esc(c.config?.projectId||'')}</p><p class="small">${esc(t('set_syncState',{s:(c.lastSyncAt?fmtStamp(c.lastSyncAt):'—')+' '+syncMsg}))}</p><p class="small">${esc(t('set_syncConflicts',{n:(S.meta.conflicts||[]).length}))}</p>
   <div class="row"><button class="btn primary" id="syNow">${t('set_syncNow')}</button><button class="btn danger" id="syOff">${t('set_syncOff')}</button></div>`:
  `<p class="small">${t('set_syncIntro')}</p>${httpsOK()?'':`<p class="small notice">${t('set_syncHttps')}</p>`}
   <label class="f"><span>${t('set_syncConfig')}</span><textarea id="syCfg" dir="ltr" rows="4" style="font-size:12px">${esc(c.config?JSON.stringify(c.config):'')}</textarea></label>
   <label class="f"><span>${t('set_syncEmail')}</span><input id="syEmail" dir="ltr" value="${esc(c.email||'')}"></label>
   <button class="btn primary" id="syOn" ${httpsOK()?'':'disabled'}>${ic('cloud')}<span>${t('set_syncEnable')}</span></button><p class="small">${esc(syncMsg)}</p>`}`;
  if(c.enabled){$('syNow').onclick=async()=>{await syncNow();renderSettings()};$('syOff').onclick=syncDisable}
  else{$('syOn').onclick=syncEnable}
}
